[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotwheels-re-tools"
version = "0.1.0"
description = "Reproducible ROM and savestate analysis tools for HotWheelsGym"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HotWheelsGym contributors" }]
dependencies = []

[project.scripts]
hwre = "hotwheels_re_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

