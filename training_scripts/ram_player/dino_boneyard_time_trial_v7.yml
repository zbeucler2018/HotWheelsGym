run_name: dino_ram_player_time_trial_v7

# This is a bounded comparison run. Promote only models that beat the v5/v6
# baselines in full start-line evaluation before spending an overnight budget.
total_timesteps: 1500000
num_envs: 3
seed: 2026

environment: HWSTC-dino_boneyard-multi-3
frame_skip: 4
max_episode_steps: 4500
evaluation_max_episode_steps: 6000

opponents: {}
opponent_state: null

# Every worker samples the full pool on reset. The explicit start-line state
# addresses v6's weak first lap; the remaining states preserve track coverage.
sample_training_states: true
training_states:
  - training_scripts/data/states/dino_boneyard_multi.state
  - training_scripts/data/states/dino_boneyard_multi_71.state
  - training_scripts/data/states/dino_boneyard_multi_156.state
  - training_scripts/data/states/dino_boneyard_multi_180.state
  - training_scripts/data/states/dino_boneyard_multi_290.state
  # Generated locally by create_hairpin_states.py and ignored by Git. Duplicates
  # deliberately weight both conditional hairpin strategies more heavily.
  - training_scripts/ram_runs/private/dino_hairpin_no_jet.state
  - training_scripts/ram_runs/private/dino_hairpin_with_jet.state
  - training_scripts/ram_runs/private/dino_hairpin_no_jet.state
  - training_scripts/ram_runs/private/dino_hairpin_with_jet.state

# Optimize forward progress per emulator frame. Centerline distance and raw
# speed remain observations/diagnostics, but are intentionally not objectives.
reward:
  mode: time_trial
  progress_scale: 1.0
  frame_cost: 0.02
  wall_penalty: 0.1
  wrong_way_penalty: 0.02
  respawn_penalty: 10.0
  rank_gain: 0.25
  lap_bonus: 5.0
  finish_bonus: 50.0

eval_every_timesteps: 100000
eval_episodes: 2
checkpoint_every_timesteps: 250000
record_video: true

ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_layers: [128, 128]
  value_layers: [128, 128]
