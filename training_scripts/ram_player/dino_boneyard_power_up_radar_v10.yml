run_name: dino_ram_player_power_up_radar_v10

# Pickup-line fine-tune from the fastest verified v9 checkpoint (4:22.92).
# Observation v7 appends a live five-value pickup radar; migration zeroes those
# new input weights so the starting policy is exactly behavior-identical to v9.
resume_model: training_scripts/ram_runs/dino_ram_player_self_play_v9_20260915T021134Z/evaluation_sweep_20260915T110125Z/fastest_model.zip
total_timesteps: 750000
num_envs: 3
seed: 2029

environment: HWSTC-dino_boneyard-multi-3
frame_skip: 4
max_episode_steps: 6000
evaluation_max_episode_steps: 6000

# First teach the pickup line against stock traffic. Once it reliably acquires
# Jet Boost and retains the v9 race time, the next run can restore the league.
opponents: {}
opponent_league: {}
opponent_state: null

# Half start on the real grid; the remainder rehearse the approach immediately
# before the first Jet Boost. The with-Jet state retains exploitation practice.
sample_training_states: true
training_states:
  - training_scripts/data/states/dino_boneyard_multi.state
  - training_scripts/data/states/dino_boneyard_multi.state
  - training_scripts/data/states/dino_boneyard_multi.state
  - training_scripts/data/states/dino_boneyard_multi.state
  - training_scripts/data/states/dino_boneyard_multi.state
  - training_scripts/ram_runs/private/dino_pickup_v8/dino_hairpin_no_jet.state
  - training_scripts/ram_runs/private/dino_pickup_v8/dino_hairpin_no_jet.state
  - training_scripts/ram_runs/private/dino_pickup_v8/dino_hairpin_no_jet.state
  - training_scripts/ram_runs/private/dino_pickup_v8/dino_hairpin_no_jet.state
  - training_scripts/ram_runs/private/dino_pickup_v8/dino_hairpin_with_jet.state

reward:
  mode: time_trial
  progress_scale: 1.0
  frame_cost: 0.02
  wall_penalty: 0.1
  wrong_way_penalty: 0.02
  respawn_penalty: 10.0
  rank_gain: 0.25
  lap_bonus: 5.0
  finish_bonus: 50.0
  jet_boost_pickup_bonus: 8.0
  # Potential-difference shaping is bounded to 2 points per successful
  # approach and is paid back when the car passes the pickup without taking it.
  power_up_approach_scale: 2.0

eval_every_timesteps: 50000
eval_episodes: 2
checkpoint_every_timesteps: 50000
record_video: true

ppo:
  learning_rate: 0.000025
  n_steps: 1024
  batch_size: 256
  n_epochs: 5
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.002
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_layers: [128, 128]
  value_layers: [128, 128]
